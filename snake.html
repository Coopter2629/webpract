<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #4caf50;
        }
        #score-board {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        canvas {
            border: 4px solid #4caf50;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        #game-over-text {
            display: none;
            color: #ff5252;
            font-size: 1.2rem;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="game-over-text">Game Over! Press Spacebar to Restart</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; // initial horizontal velocity
        let dy = 0; // initial vertical velocity
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        // Start the game loop
        function startGame() {
            isGameOver = false;
            snake = [{ x: 10, y: 10 }];
            generateFood();
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOverText.style.display = "none";
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 100); // Runs every 100ms
        }

        // Main game logic update
        function updateGame() {
            if (isGameOver) return;

            moveSnake();

            if (checkCollision()) {
                isGameOver = true;
                gameOverText.style.display = "block";
                clearInterval(gameInterval);
                return;
            }

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop(); // Remove the tail segment if food wasn't eaten
            }

            drawGrid();
        }

        // Move the head coordinate forward based on velocities
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
        }

        // Check wall and self collisions
        function checkCollision() {
            const head = snake[0];
            
            // Wall collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // Self collisions
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Draw everything to the canvas
        function drawGrid() {
            // Clear canvas
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            ctx.fillStyle = "#4caf50";
            snake.forEach((segment, index) => {
                // Make the head a slightly lighter green
                ctx.fillStyle = index === 0 ? "#81c784" : "#4caf50";
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Food
            ctx.fillStyle = "#ff5252";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // Spawn food at a random grid coordinate
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Ensure food doesn't spawn on top of the snake body
            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                }
            });
        }

        // Handle Keyboard arrow clicks
        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case "ArrowDown":
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
                case " ": // Spacebar restarts
                    if (isGameOver) startGame();
                    break;
            }
        });

        // Initialize game on load
        startGame();
    </script>
</body>
</html>
