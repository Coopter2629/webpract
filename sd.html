<!DOCTYPE html>
<html lang="en">
<head>
  <title>hfsslhd</title>
  <link rel="icon" type="image/png" href="me.png"/>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --1: #CCA664;
      --2: #D6B67E;
      --bg: #F2CD8D;
      --tx: #A68650;
    }
    html{
      scroll-behavior: smooth;
    }
    body{
      background: var(--bg);
      font-family:  'Courier New', Courier, monospace;      
    }
    main{
      min-height: 100vh;
      display: flex;
      margin: 0;      
    }
    .h{
      display: inline-block;
      background: var(--1);
      padding: 12px 12px;
      color: var(--tx);
    }
    .h:hover {
      background-color: var(--2);
      transform: translate(2px, 2px);
    }
  </style>
  <body>
    <main>
      <div class="h">
        <a></a>
      </div>
    </main>
  </body>
</head>
