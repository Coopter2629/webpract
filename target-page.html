<!DOCTYPE html>
<html lang="en">
<head>
  <title>New page</title>
  <link rel="icon" type="image/png" href="me.png" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta charset="utf-8" />
  <style>
      :root{
        --bg: #120C52;
        --slate: #3D3573;
        --text: #808080;
        --1: #3D3573;
        --2: #524896;
      }
    html{
        scroll-behavior: smooth;
      }
    body{
      font-family: sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(150, 3, 48, 0.16), transparent 60%),
        linear-gradient(165deg, var(--bg) 0%, var(--slate) 100%);
      margin: 0;
      min-height: 100vh;
    }
    .headbtn{
      background-color: var(--1);
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      display: flex;
      gap: 3px;
      transition: background-color 0.2s ease;
    }
    .headbtn:hover{
      background-color: var(--2);
    }
    .h{
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 12px;
      z-index: 1000;
    }      
  </style>
</head>
  <body>
    <main>
      <div class="h">
      <a href="./index.html" class="headbtn">Home</a>
      <a href="https://www.youtube.com/" class="headbtn" target="_blank">Youtube</a>
      </div>
    </main>
  </body>
</html>
