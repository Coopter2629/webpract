<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="icon" type="png" href="./me.png" />
  <title>testsite</title>
  <style>
    :root{
     --bg: #120C52;
     --slate: #3D3573;
      --text: #232c3b;

    }
     body{
       min-height: 100vh;

        linear-gradient(165deg, var(--bg) 0%, var(--slate) 100%);
        }
    html {
      scroll-behavior: smooth;
    }
    footer {
      display: flex;
      justify-content: space-between;
      padding: 1rem 2rem;
    }
    <a href="./setup.exe" download class="download-btn">Download File</a>
  
</head>

      justify-content: space-between;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 22px 24px 0;
    }
    .download-btn {
  display: inline-block;
  padding: 10px 20px;
  background-color: #3D3573;
  color: #ffffff;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}

.download-btn:hover {
  background-color: #524896;
}
