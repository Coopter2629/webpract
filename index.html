<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>testsite</title>
  <style>
    :root{
     --bg: #120C52;
     --slate: #3D3573;
      --text: #232c3b;
    }
     body{
       min-height: 100vh;     
       background-color: var(--bg);
            color: var(--text); 
            margin: 0;
            font-family: sans-serif;

    html {
      scroll-behavior: smooth;
    }
    footer {
      display: flex;
      justify-content: space-between;
      padding: 1rem 2rem;
    }
  </style>
</head>
  <body>

      padding: 22px 24px 0;
    }
    </main>
    
  <footer>
    <span>Test site</span>
    <span>V0.5</span>

</html>
