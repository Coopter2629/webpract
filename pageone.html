<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Page 2</title>
    <link rel="icon" type="image/png" href="./me.png" />
    <style>
      :root {
        --bg: #120C52;
        --slate: #3D3573;
        --text1: #808080;
        --1: #3D3573;
        --2: #524896;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        color: var(--text1);
        font-family: sans-serif;
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(150, 3, 48, 0.16), transparent 60%),
          linear-gradient(165deg, var(--bg) 0%, var(--slate) 100%);
        margin: 0;
        padding: 0;
        height: 100%;
      }
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        }
      .btn {
        position: fixed;
        top: 12px;
        left: 12px;
        background-color: var(--1);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: bold;
        text-decoration: none;
      }
      .btn:hover {
        background-color: var(--2);
      }
      .entry-card {
        background-color: var(--slate);
        padding: 16px;
        margin: 60px auto 16px;
        border-radius: 8px;
        max-width: 300px;
        text-align: center;
      }
      .entry-image {
        width: 100%;
        height: auto;
        border-radius: 4px;
      }
      header{
        position: fixed;
        background: #193680;
        width: 100%;
        height: 60px;
        top: 0;
        left: 0;
      }
      .entry-name {
        color: #ffffff;
        margin-top: 8px;
      }
      .hk{
        margin: 0;
      }
      .he{
    position: absolute;
    top: 10%;
    left: 25%;        
    color: #ffffff;
    margin: 0;
}
      .hw{
        position: absolute;
        top: 700px;
        left: 50%;
        margin: 0;
        color: #000000;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="./index.html" class="btn">Home</a>
      </header>
      <h3 class="hk">Center test</h3>
      <div class="he">
        <h1>This should be higher up</h1>
        <p>Hello (this should be smaller)</p>
      </div>
      <div class="hw">
       <p>hi3</p>
      </div>
    </main>
  </body>
</html>
