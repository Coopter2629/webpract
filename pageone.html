<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test Page 2</title>
    <link rel="icon" type="image/png" href="./me.png" />
    <style>
      :root {
        --bg: #120C52;
        --slate: #3D3573;
        --text1: #808080;
        --1: #3D3573;
        --2: #524896;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        color: var(--text1);
        font-family: sans-serif;
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(150, 3, 48, 0.16), transparent 60%),
          linear-gradient(165deg, var(--bg) 0%, var(--slate) 100%);
      }
      .btn {
        position: fixed;
        top: 12px;
        left: 12px;
        background-color: var(--1);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: bold;
        text-decoration: none;
      }
      .btn:hover {
        background-color: var(--2);
      }
      .entry-card {
        background-color: var(--slate);
        padding: 16px;
        margin: 60px auto 16px;
        border-radius: 8px;
        max-width: 300px;
        text-align: center;
      }
      .entry-image {
        width: 100%;
        height: auto;
        border-radius: 4px;
      }
      .entry-name {
        color: #ffffff;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="./index.html" class="btn">Home</a>
      <div id="entry-container"></div>
    </main>

    <script>
      function addEntry(name, imageUrl) {
        const container = document.getElementById('entry-container');

        const entryCard = document.createElement('div');
        entryCard.className = 'entry-card';

        const imgElement = document.createElement('img');
        imgElement.src = imageUrl;
        imgElement.alt = name;
        imgElement.className = 'entry-image';

        const nameElement = document.createElement('h3');
        nameElement.textContent = name;
        nameElement.className = 'entry-name';

        entryCard.appendChild(imgElement);
        entryCard.appendChild(nameElement);
        container.appendChild(entryCard);
      }

      addEntry('Sample Title', './me.png');
    </script>
  </body>
</html>
